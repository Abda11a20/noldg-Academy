name: CodeQL

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  schedule:
    - cron: "31 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1
        with:
          version: 11.28.11
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: javascript-typescript
      - run: pnpm build
        env:
          VITE_API_ORIGIN: https://api.example.invalid
          VITE_UPLOAD_ORIGINS: https://api.cloudinary.com
          VITE_IMAGE_ORIGINS: https://res.cloudinary.com
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
